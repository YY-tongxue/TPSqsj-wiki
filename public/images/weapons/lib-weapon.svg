<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- 武器占位图：灰色枪械剪影，等待替换为游戏截图 -->
  <rect width="200" height="120" rx="10" fill="#1c2b3a" />
  <g fill="none" stroke="#8b9bad" stroke-width="7" stroke-linecap="round">
    <!-- 枪身 -->
    <line x1="18" y1="72" x2="118" y2="72" />
    <!-- 枪管 -->
    <line x1="88" y1="72" x2="178" y2="52" />
    <!-- 枪托 -->
    <line x1="30" y1="72" x2="52" y2="92" />
    <!-- 弹匣 -->
    <line x1="66" y1="72" x2="78" y2="96" />
    <!-- 瞄准 -->
    <line x1="96" y1="60" x2="104" y2="44" />
  </g>
  <text x="100" y="110" text-anchor="middle" font-size="11" fill="#5c6f80" font-family="sans-serif">武器图标占位</text>
</svg>
